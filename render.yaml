services:
  - type: web
    name: multilingual-chatbot-api
    runtime: python
    pythonVersion: "3.11.12"
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: PYTHONIOENCODING
        value: utf-8

